aid: green-revolution-cooling
name: Green Revolution Cooling
description: >-
  Green Revolution Cooling, which does business as GRC and brands itself "The Immersion
  Cooling Authority", is an Austin, Texas manufacturer of single-phase liquid immersion
  cooling systems for data centers. Founded in 2009, GRC builds the ICEraQ family of
  immersion-cooled racks (SX, Flex, Nano, Micro), the ICEtank containerized immersion data
  center, the ReliaSys IR500 coolant distribution unit, and ElectroSafe dielectric fluids,
  and sells them into AI/ML, HPC, edge, enterprise, cloud and hyperscale data centers in
  more than twenty countries. Its only software product is Systems Manager, an on-premises
  appliance that gives operators a single monitoring interface across connected ICEraQ and
  ICEtank systems over the customer's own secure network. GRC publishes no developer
  portal, no API reference, no SDKs and no machine-readable API description; its systems
  integrate with data center DCIM and BMS platforms through industrial protocols such as
  Modbus TCP, SNMP and BACnet rather than through a web API.
